<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
</head>
<body>
    <h1>Contact Registration Form</h1>
    
    <form action="#" method="get">
        <fieldset>
            <legend>Personal Information</legend>
            
            <div>
                <label for="fullname">Full Name *</label>
                <input 
                    type="text" 
                    id="fullname" 
                    name="fullname" 
                    required 
                    aria-required="true"
                    aria-describedby="fullname-help">
                <small id="fullname-help">Please enter your full name</small>
            </div>

            <div>
                <label for="email">Email Address *</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                    aria-required="true"
                    aria-describedby="email-help"
                    aria-invalid="false">
                <small id="email-help">Enter a valid email (e.g., user@example.com)</small>
            </div>

            <div>
                <label for="phone">Phone Number *</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    required 
                    pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                    placeholder="123-456-7890"
                    aria-required="true"
                    aria-describedby="phone-help"
                    aria-invalid="false">
                <small id="phone-help">Format: 123-456-7890</small>
            </div>

            <div>
                <label for="birthdate">Date of Birth *</label>
                <input 
                    type="date" 
                    id="birthdate" 
                    name="birthdate" 
                    required 
                    aria-required="true"
                    aria-describedby="birthdate-help">
                <small id="birthdate-help">Select your date of birth</small>
            </div>
        </fieldset>

        <fieldset>
            <legend>Additional Information</legend>
            
            <div>
                <label for="comments">Comments/Message *</label>
                <textarea 
                    id="comments" 
                    name="comments" 
                    rows="5" 
                    cols="50" 
                    required 
                    aria-required="true"
                    aria-describedby="comments-help"></textarea>
                <small id="comments-help">Please share your thoughts or questions (minimum 10 characters)</small>
            </div>

            <div>
                <label for="subscribe">
                    <input 
                        type="checkbox" 
                        id="subscribe" 
                        name="subscribe"
                        aria-describedby="subscribe-help">
                    Subscribe to newsletter
                </label>
                <small id="subscribe-help">Receive updates and news</small>
            </div>
        </fieldset>

        <div>
            <button type="submit">Submit Form</button>
            <button type="reset">Reset Form</button>
        </div>
    </form>
</body>
</html>
