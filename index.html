<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment_2</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="app">
    <header class="header">
      <h1>How’s the sky looking today?</h1>
    </header>

    <div class="search">
      <input type="text" placeholder="Search for a place..." />
      <button>Search</button>
    </div>

    <div class="main">

      <div class="weather-card">
        <h2>Berlin, Germany</h2>
        <p>Tuesday, Aug 5, 2025</p>

        <div class="temp">
          <span>20°</span>
          <img src="sun.png" class="icon" />
        </div>

        <div class="details">
          <div>Feels Like<br><b>18°</b></div>
          <div>Humidity<br><b>46%</b></div>
          <div>Wind<br><b>14 km/h</b></div>
          <div>Rain<br><b>0 mm</b></div>
        </div>
      </div>

      <div class="hourly">
        <h3>Hourly forecast</h3>
        <div class="hour">3 PM <span>20°</span></div>
        <div class="hour">4 PM <span>20°</span></div>
        <div class="hour">5 PM <span>20°</span></div>
      </div>

    </div>

    <div class="daily">
      <div class="day">Tue<br>20°</div>
      <div class="day">Wed<br>21°</div>
      <div class="day">Thu<br>24°</div>
    </div>

  </div>
</body>

</html>
